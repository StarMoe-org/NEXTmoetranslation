name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            server/offline/go.sum

      - name: Prepare test roots
        run: |
          sudo install -d -m 1777 /private/tmp
          test_root="$RUNNER_TEMP/nexttrans-go-tests"
          install -d -m 0700 \
            "$test_root" \
            "$test_root/tmp" \
            "$test_root/gotmp" \
            "$test_root/active-run" \
            "$test_root/recovery-tests"
          {
            echo "TMPDIR=$test_root/tmp"
            echo "GOTMPDIR=$test_root/gotmp"
            echo "MOESEKAI_SESSION_ROOT=$test_root/active-run"
            echo "MOESEKAI_RECOVERY_V2_TEST_PRIVATE_RUN_ROOT=$test_root/recovery-tests"
          } >> "$GITHUB_ENV"

      - name: Verify server
        working-directory: server
        run: |
          go vet ./...
          go test -count=1 -timeout=15m ./...

      - name: Verify offline tools
        working-directory: server/offline
        run: |
          go vet ./...
          go test -count=1 -timeout=10m ./...

      - name: Verify public lyrics baseline
        run: python3 scripts/verify-public-lyrics-baseline.py

  web:
    name: Web console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify web
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run lint
          npm run build
